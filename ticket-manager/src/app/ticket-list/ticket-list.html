<div class="list-header">
  <h2>Tickets</h2>
  <a mat-flat-button color="primary" routerLink="/tickets/new">New Ticket</a>
</div>

<table mat-table [dataSource]="tickets" class="mat-elevation-z2">

  <ng-container matColumnDef="product">
    <th mat-header-cell *matHeaderCellDef>Product</th>
    <td mat-cell *matCellDef="let ticket">
      @if (getProduct(ticket.productId); as product) {
        <span class="product-badge" [style.background-color]="product.color">
          {{ product.name }}
        </span>
      }
    </td>
  </ng-container>

  <ng-container matColumnDef="category">
    <th mat-header-cell *matHeaderCellDef>Category</th>
    <td mat-cell *matCellDef="let ticket">{{ getCategoryName(ticket.categoryId) }}</td>
  </ng-container>

  <ng-container matColumnDef="subject">
    <th mat-header-cell *matHeaderCellDef>Subject</th>
    <td mat-cell *matCellDef="let ticket">{{ ticket.subject }}</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let ticket">{{ ticket.status }}</td>
  </ng-container>

  <ng-container matColumnDef="priority">
    <th mat-header-cell *matHeaderCellDef>Priority</th>
    <td mat-cell *matCellDef="let ticket">
      <span class="priority-badge" [style.background-color]="getPriorityColor(ticket.priority)">
        {{ ticket.priority }}
      </span>
    </td>
  </ng-container>

  <ng-container matColumnDef="createdAt">
    <th mat-header-cell *matHeaderCellDef>Created</th>
    <td mat-cell *matCellDef="let ticket">{{ ticket.createdAt | date:'dd.MM.yyyy HH:mm' }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let ticket">
      <a mat-icon-button [routerLink]="['/tickets', ticket.ticketId, 'edit']"
         aria-label="Edit ticket">
        <mat-icon>edit</mat-icon>
      </a>
      <button mat-icon-button color="warn" (click)="onDelete(ticket.ticketId)"
              aria-label="Delete ticket">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

</table>
